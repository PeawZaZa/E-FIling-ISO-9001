<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Screen Atlas — ISO E-Filing Phase 1</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans Thai',sans-serif;background:#f0f4f8;color:#1e293b;font-size:13px}
header{background:#1e3055;color:#fff;padding:18px 32px;display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;position:sticky;top:0;z-index:100}
header h1{font-size:18px;font-weight:700}
header p{font-size:11px;color:#7da4e0;margin-top:3px}
.hbadge{display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,.08);color:#cbd5e1;cursor:pointer}
.hbadge span{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* Swimlane separators */
.lane-sep{display:flex;align-items:center;gap:14px;padding:28px 32px 14px;position:relative}
.lane-line{flex:1;height:2px}
.lane-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap;padding:5px 14px;border-radius:20px}
.lane-shared .lane-line{background:#94a3b830}.lane-shared .lane-label{background:#f1f5f9;color:#475569}
.lane-groupa .lane-line{background:#2463d930}.lane-groupa .lane-label{background:#dbeafe;color:#1e40af}
.lane-groupb .lane-line{background:#7c3aed30}.lane-groupb .lane-label{background:#ede9fe;color:#4c1d95}

/* Flow connector between cards */
.flow-arrow{display:flex;align-items:center;gap:10px;padding:4px 32px;color:#64748b;font-size:11px}
.flow-arrow hr{flex:1;border:none;border-top:1px dashed #d1d5db}

/* Screen card */
.scard{display:flex;margin:0 32px 2px;background:#fff;border-radius:12px;border:1px solid #e2e8f0;box-shadow:0 2px 8px rgba(0,0,0,.06);overflow:hidden;min-height:340px}
.scard-accent{width:5px;flex-shrink:0}
.shared .scard-accent{background:#94a3b8}
.groupa .scard-accent{background:#2463d9}
.groupb .scard-accent{background:#7c3aed}
.integ .scard-accent{background:#64748b;background:repeating-linear-gradient(45deg,#64748b,#64748b 4px,transparent 4px,transparent 8px)}

/* Mockup panel */
.mock-panel{width:460px;flex-shrink:0;background:#f8fafc;border-right:1px solid #e2e8f0;padding:16px;display:flex;flex-direction:column}
.browser{background:#fff;border-radius:8px;border:1px solid #d1d5db;overflow:hidden;flex:1}
.bchrome{background:#f1f5f9;padding:7px 10px;display:flex;align-items:center;gap:7px;border-bottom:1px solid #e2e8f0}
.bdot{width:8px;height:8px;border-radius:50%}
.burl{flex:1;background:#fff;border-radius:4px;padding:2px 8px;font-size:9px;color:#94a3b8;font-family:'IBM Plex Mono',monospace;border:1px solid #e2e8f0}
.bcontent{padding:12px;overflow:hidden}

/* Info panel */
.info-panel{flex:1;padding:22px;display:flex;flex-direction:column;gap:13px;min-width:0}
.info-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sid{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:700}
.sname{font-size:17px;font-weight:700;color:#0f172a;margin-top:2px;line-height:1.2}
.ssub{font-size:12px;color:#94a3b8;margin-top:2px}
.grp-badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;flex-shrink:0}
.gb-shared{background:#f1f5f9;color:#475569}
.gb-groupa{background:#dbeafe;color:#1e40af}
.gb-groupb{background:#ede9fe;color:#4c1d95}
.gb-integ{background:#f1f5f9;color:#475569}

.irow{display:flex;flex-direction:column;gap:4px}
.ilabel{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#94a3b8}
.ival{font-size:12px;color:#374151;line-height:1.6}
.uc-val{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:700}

.pills{display:flex;flex-wrap:wrap;gap:3px;margin-top:2px}
.pill{display:inline-block;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:500;line-height:1.4}
.p-actor{background:#eff6ff;color:#1e40af}
.p-fr{background:#f0fdf4;color:#166534}
.p-nfr{background:#fef3c7;color:#92400e}
.p-sc{background:#f5f3ff;color:#4c1d95}
.p-tc{background:#fdf2f8;color:#9d174d;font-weight:700}
.p-flow{background:#f1f5f9;color:#475569;font-family:'IBM Plex Mono',monospace;font-size:10px}
.api-line{font-family:'IBM Plex Mono',monospace;font-size:10px;color:#1e40af;background:#eff6ff;padding:3px 8px;border-radius:4px;margin-bottom:3px;display:block;word-break:break-all}
.etag{display:inline-block;background:#f8fafc;border:1px solid #e2e8f0;border-radius:4px;padding:2px 6px;font-size:10px;color:#475569;margin:2px}

/* Mini mockup base styles */
.mm{font-size:11px;line-height:1.4}
.mm .mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.mm .mt{font-size:13px;font-weight:700;color:#0f172a}
.mm .mb{padding:3px 10px;border-radius:4px;background:#2463d9;color:#fff;font-size:9px;border:none;cursor:pointer}
.mm input,.mm textarea,.mm select{width:100%;padding:5px 8px;border:1px solid #d1d5db;border-radius:4px;font-size:10px;margin-bottom:5px;font-family:inherit;background:#fff;color:#374151;resize:none}
.mm .mlbl{font-size:9px;font-weight:600;color:#374151;margin-bottom:2px;display:block}
.mm .msep{border:none;border-top:1px solid #f1f5f9;margin:6px 0}
.mm .mtabs{display:flex;gap:0;border-bottom:1px solid #e2e8f0;margin-bottom:8px}
.mm .mtab{padding:4px 10px;font-size:10px;border-bottom:2px solid transparent;color:#64748b}
.mm .mtab.on{color:#2463d9;border-bottom-color:#2463d9;font-weight:600}
.badge{display:inline-block;padding:1px 6px;border-radius:10px;font-size:9px;font-weight:600}
.bg{background:#d1fae5;color:#065f46}.ba{background:#fef3c7;color:#92400e}
.bb{background:#dbeafe;color:#1e40af}.br{background:#fee2e2;color:#991b1b}
.bp{background:#ede9fe;color:#4c1d95}.bs{background:#f1f5f9;color:#475569}
.mm table{width:100%;border-collapse:collapse;font-size:10px}
.mm th{background:#f8fafc;padding:4px 6px;text-align:left;font-size:9px;font-weight:700;color:#64748b;text-transform:uppercase;border-bottom:1px solid #e2e8f0}
.mm td{padding:5px 6px;border-bottom:1px solid #f8fafc}
.mm .card{background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;padding:8px;margin-bottom:6px}
.mm .card.lnc{border-left:3px solid #ef4444}
.mm .card.lofi{border-left:3px solid #f59e0b}
.mm .card.lcar{border-left:3px solid #7c3aed}
.mm .card.lover{border-left:3px solid #ef4444;background:#fff5f5}
.mm .kpig{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:8px}
.mm .kpi{background:#f8fafc;border:1px solid #e2e8f0;border-radius:5px;padding:6px;text-align:center}
.mm .kv{font-size:15px;font-weight:800;color:#2463d9}.mm .kl{font-size:8px;color:#64748b}
.mm .sidebar{width:100px;flex-shrink:0;background:#f8fafc;border-right:1px solid #e2e8f0;padding:7px}
.mm .si{padding:4px 6px;border-radius:4px;margin-bottom:2px;font-size:9px}
.mm .si.on{background:#dbeafe;color:#1e40af;font-weight:600}
.mm .pb{height:5px;background:#f1f5f9;border-radius:3px;overflow:hidden;margin-top:2px}
.mm .pf{height:100%;border-radius:3px}
.mm .row{display:flex;justify-content:space-between;font-size:9px;margin-bottom:1px}

@media print{header{position:static}.lane-sep{break-before:auto}.scard{break-inside:avoid;margin-bottom:16px}body{background:#fff}}
</style>

// ── Render ────────────────────────────────────────────────────────────────────
const app = document.getElementById('app');
let lastGroup = null;
const FLOWS = [
  {from:'UI-S01',to:'UI-A01',label:'Login สำเร็จ → เข้าสู่ Dashboard → Documents'},
  {from:'UI-A01',to:'UI-A02',label:'+ สร้างเอกสารใหม่'},
  {from:'UI-A01',to:'UI-A03',label:'คลิกแถวเอกสาร → Document Detail (Info / Versions / DAR / ACK)'},
  {from:'UI-A02',to:'UI-A03',label:'Save Draft → Document Detail'},
  {from:'UI-A03',to:'UI-A04',label:'กด + DAR → สร้าง Document Action Request'},
  {from:'UI-A04',to:'UI-A05',label:'Submit DAR → เข้า Approval Queue'},
  {from:'UI-A05',to:'UI-A03',label:'Approve / Reject → Document status เปลี่ยน → กลับ Detail'},
  {from:'UI-A03',to:'UI-A06',label:'Publish แล้ว → ผู้เกี่ยวข้อง Acknowledge'},
  {from:'UI-A06',to:'INT-A08',label:'ACK Summary พร้อม → ส่งผ่าน Integration API'},
  {from:'INT-A08',to:'UI-B05',label:'Document Summary + ACK Rate → Group B Dashboard'},
  {from:'UI-B05',to:'UI-B01',label:'Drill-down → Records & Evidence'},
  {from:'UI-B01',to:'UI-B02',label:'Evidence ผูกกับ Finding / Audit Session'},
  {from:'UI-B02',to:'UI-B03',label:'NC Finding → เปิด CAR'},
  {from:'UI-B03',to:'UI-B04',label:'Monitor Overdue CARs'},
  {from:'UI-S01',to:'UI-S02',label:'IT/Admin Login → User Management'},
  {from:'UI-S02',to:'UI-S03',label:'Admin / ISO Admin → Audit Trail Viewer'},
];

function getFlow(fromId, toId) {
  return FLOWS.find(f => f.from===fromId && f.to===toId);
}

SCREENS.forEach((s, i) => {
  const g = s.group;

  // Lane separator
  if (g !== lastGroup) {
    const labels = {shared:'⬡ SHARED — Login / User Management / Audit Trail',groupa:'▦ GROUP A — Document Control / DAR / Publication / Acknowledgement',groupb:'▦ GROUP B — Records / Audit / Finding / CAR / Dashboard',integ:'↕ INTEGRATION — Group A → Group B API Contract'};
    const sep = document.createElement('div');
    sep.className = `lane-sep lane-${g}`;
    sep.innerHTML = `<div class="lane-line"></div><div class="lane-label">${labels[g]||g}</div><div class="lane-line"></div>`;
    app.appendChild(sep);
    lastGroup = g;
  }

  // Flow connector from previous screen
  if (i > 0) {
    const prev = SCREENS[i-1];
    const flow = getFlow(prev.id, s.id);
    if (flow) {
      const fc = document.createElement('div');
      fc.className = 'flow-arrow';
      fc.innerHTML = `<hr/><span style="white-space:nowrap">↓ ${flow.label} ↓</span><hr/>`;
      app.appendChild(fc);
    } else {
      const fc = document.createElement('div');
      fc.style.cssText = 'height:10px';
      app.appendChild(fc);
    }
  }

  // Build card
  const color = GC[g]||'#94a3b8';
  const card = document.createElement('div');
  card.className = `scard ${g}`;
  card.id = s.id;

  const actors = (s.actors||[]).map(a=>`<span class="pill p-actor">${AN[a]||a}</span>`).join('');
  const frs = (s.fr||[]).map(f=>`<span class="pill p-fr">${f}</span>`).join('');
  const nfrs = (s.nfr||[]).map(f=>`<span class="pill p-nfr">${f}</span>`).join('');
  const apis = (s.api||[]).map(a=>`<span class="api-line">${a}</span>`).join('');
  const ents = (s.entities||[]).map(e=>`<span class="etag">${e}</span>`).join('');
  const scs = (s.sc||[]).map(x=>`<span class="pill p-sc">${x}</span>`).join('');
  const tos = (s.to||[]).map(t=>`<span class="pill p-flow">→ ${t}</span>`).join('');

  const gbClass = {shared:'gb-shared',groupa:'gb-groupa',groupb:'gb-groupb',integ:'gb-integ'}[g]||'gb-shared';

  card.innerHTML = `
  <div class="scard-accent"></div>
  <div class="mock-panel">
    <div class="browser">
      <div class="bchrome">
        <div style="display:flex;gap:4px"><div class="bdot" style="background:#ef4444"></div><div class="bdot" style="background:#f59e0b"></div><div class="bdot" style="background:#22c55e"></div></div>
        <div class="burl">localhost:3000/${s.id.toLowerCase()}</div>
      </div>
      <div class="bcontent">${s.mockup||''}</div>
    </div>
  </div>
  <div class="info-panel">
    <div class="info-top">
      <div>
        <div class="sid" style="color:${color}">${s.id}</div>
        <div class="sname">${s.name}</div>
        <div class="ssub">${s.sub}</div>
      </div>
      <span class="grp-badge ${gbClass}">${GL[g]||g}</span>
    </div>
    <div class="irow"><div class="ilabel">Use Case</div><div class="uc-val" style="color:${color}">${s.uc}</div></div>
    <div class="irow"><div class="ilabel">Actors</div><div class="pills">${actors}</div></div>
    <div class="irow"><div class="ilabel">Functional Requirements</div><div class="pills">${frs}${nfrs}</div></div>
    <div class="irow"><div class="ilabel">API Endpoints</div><div>${apis}</div></div>
    <div class="irow"><div class="ilabel">Main Entities</div><div>${ents}</div></div>
    ${s.tc?`<div class="irow"><div class="ilabel">Test Case & Scenarios</div><div class="pills"><span class="pill p-tc">🧪 ${s.tc}</span>${scs}</div></div>`:''}
    ${tos?`<div class="irow"><div class="ilabel">Flow ไปยัง</div><div class="pills">${tos}</div></div>`:''}
  </div>`;

  app.appendChild(card);
});
