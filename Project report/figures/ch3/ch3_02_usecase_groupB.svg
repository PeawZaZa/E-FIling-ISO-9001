  <text x="56" y="1000" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="23" font-weight="700" fill="#475569">คำอธิบาย</text>
  <ellipse cx="72" cy="1022" rx="16" ry="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="96" y="1030" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="21" fill="#475569">งานพื้นฐานร่วม</text>
  <ellipse cx="72" cy="1046" rx="16" ry="9" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="96" y="1054" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="21" fill="#475569">งานของกลุ่ม B</text>
