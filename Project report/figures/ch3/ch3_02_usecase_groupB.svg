  <ellipse cx="600" cy="568" rx="150" ry="34" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="600" y="578" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="25" fill="#14532d">UC-06 บันทึกประเด็นที่พบ</text>

  <ellipse cx="600" cy="648" rx="150" ry="34" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="600" y="658" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="25" fill="#14532d">UC-07 เปิดใบคำร้อง</text>

  <ellipse cx="600" cy="728" rx="150" ry="34" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="600" y="738" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="25" fill="#14532d">UC-08 บันทึกสาเหตุและการแก้ไข</text>

  <ellipse cx="600" cy="808" rx="150" ry="34" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="600" y="818" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="25" fill="#14532d">UC-09 ทวนสอบและปิดใบคำร้อง</text>

  <ellipse cx="600" cy="888" rx="150" ry="34" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="600" y="898" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="25" fill="#14532d">UC-10 ติดตามงานเกินกำหนด</text>

  <ellipse cx="600" cy="948" rx="150" ry="30" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="600" y="958" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="25" fill="#14532d">UC-11 ดูแดชบอร์ดปฏิบัติการ</text>

  <ellipse cx="600" cy="1008" rx="150" ry="30" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="600" y="1018" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="25" fill="#14532d">UC-12 ส่งออกรายงานสรุป</text>

  <!-- ===== Associations: ISO/QA User (left, from x=150 y=300) ===== -->
  <g stroke="#475569" stroke-width="2.5" fill="none">
    <line x1="152" y1="300" x2="450" y2="172"/>
    <line x1="152" y1="302" x2="450" y2="330"/>
