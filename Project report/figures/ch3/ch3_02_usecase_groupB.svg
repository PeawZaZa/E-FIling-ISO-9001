<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1080" width="145mm" height="130.5mm">
  <rect x="0" y="0" width="1200" height="1080" fill="#ffffff"/>

  <text x="600" y="46" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="36" font-weight="700" fill="#0f172a">แผนภาพกรณีการใช้งานของระบบกลุ่ม B</text>

  <!-- system boundary -->
  <rect x="310" y="80" width="580" height="960" rx="10" fill="none" stroke="#334155" stroke-width="4"/>
  <text x="600" y="118" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="28" font-weight="700" fill="#334155">ระบบทะเบียนหลักฐาน การตรวจติดตามภายใน และการติดตามการแก้ไข</text>

  <!-- ===== Actors: left ===== -->
  <!-- ISO/QA User -->
  <g stroke="#0f172a" stroke-width="3" fill="none">
    <circle cx="120" cy="290" r="20" fill="#f1f5f9"/>
    <line x1="120" y1="310" x2="120" y2="360"/>
    <line x1="88" y1="326" x2="152" y2="326"/>
    <line x1="120" y1="360" x2="96" y2="398"/>
    <line x1="120" y1="360" x2="144" y2="398"/>
  </g>
  <text x="120" y="428" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="26" font-weight="700" fill="#0f172a">ผู้ใช้งานฝ่าย ISO/QA</text>

  <!-- CAR Owner -->
  <g stroke="#0f172a" stroke-width="3" fill="none">
    <circle cx="120" cy="700" r="20" fill="#f1f5f9"/>
    <line x1="120" y1="720" x2="120" y2="770"/>
    <line x1="88" y1="736" x2="152" y2="736"/>
    <line x1="120" y1="770" x2="96" y2="808"/>
    <line x1="120" y1="770" x2="144" y2="808"/>
  </g>
  <text x="120" y="838" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="26" font-weight="700" fill="#0f172a">ผู้รับผิดชอบการแก้ไข</text>

  <!-- ===== Actors: right ===== -->
  <!-- Auditor -->
  <g stroke="#0f172a" stroke-width="3" fill="none">
    <circle cx="1080" cy="330" r="20" fill="#f1f5f9"/>
    <line x1="1080" y1="350" x2="1080" y2="400"/>
    <line x1="1048" y1="366" x2="1112" y2="366"/>
    <line x1="1080" y1="400" x2="1056" y2="438"/>
    <line x1="1080" y1="400" x2="1104" y2="438"/>
  </g>
  <text x="1080" y="468" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="26" font-weight="700" fill="#0f172a">ผู้ตรวจติดตาม</text>

  <!-- Admin -->
  <g stroke="#0f172a" stroke-width="3" fill="none">
    <circle cx="1080" cy="740" r="20" fill="#f1f5f9"/>
    <line x1="1080" y1="760" x2="1080" y2="810"/>
    <line x1="1048" y1="776" x2="1112" y2="776"/>
    <line x1="1080" y1="810" x2="1056" y2="848"/>
