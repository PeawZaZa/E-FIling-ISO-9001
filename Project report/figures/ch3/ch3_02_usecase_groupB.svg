  <text x="1080" y="878" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="26" font-weight="700" fill="#0f172a">ผู้ดูแลระบบ</text>

  <!-- ===== Use cases ===== -->
  <ellipse cx="600" cy="168" rx="150" ry="34" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="600" y="178" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="25" fill="#1e3a8a">UC-01 เข้าสู่ระบบ</text>

  <ellipse cx="600" cy="248" rx="150" ry="34" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="600" y="258" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="25" fill="#1e3a8a">UC-02 จัดการผู้ใช้และบทบาท</text>

  <ellipse cx="600" cy="328" rx="150" ry="34" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="600" y="338" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="25" fill="#1e3a8a">UC-03 ดูร่องรอยการตรวจสอบ</text>

  <ellipse cx="600" cy="408" rx="150" ry="34" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="600" y="418" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="25" fill="#14532d">UC-04 บันทึกข้อมูลและหลักฐาน</text>

  <ellipse cx="600" cy="488" rx="150" ry="34" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
