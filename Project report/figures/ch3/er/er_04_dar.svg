<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 936" role="img" aria-labelledby="er_04_dar-title er_04_dar-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="er_04_dar-title">ตารางใบขอดำเนินการเอกสารและผลตัดสินรายขั้น</title>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap');</style>
  </defs>
  <desc id="er_04_dar-desc">แผนภาพความสัมพันธ์แสดงใบขอดำเนินการเอกสารหนึ่งใบที่ระบุรายการเป้าหมายได้หลายรายการ มีผลตัดสินแยกตามขั้นตรวจรับ ทบทวน และอนุมัติ มีประวัติการเปลี่ยนสถานะแบบเพิ่มอย่างเดียว และเป็นต้นเหตุให้เกิดฉบับเอกสารใหม่ได้</desc>

  <rect width="1280" height="936" fill="#ffffff"/>

