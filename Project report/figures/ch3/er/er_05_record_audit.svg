  <title id="er_05_record_audit-title">ตารางบันทึกข้อมูล หลักฐาน รอบการตรวจติดตาม และประเด็นที่พบ</title>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap');</style>
  </defs>
  <desc id="er_05_record_audit-desc">แผนภาพความสัมพันธ์แสดงชนิดของบันทึกข้อมูลที่เป็นข้อมูลตั้งค่า บันทึกข้อมูลที่แนบหลักฐานได้ รอบการตรวจติดตามที่มีทีมผู้ตรวจและตรวจความเป็นอิสระของผู้ตรวจจากกลุ่มงานเป้าหมาย และประเด็นที่พบซึ่งอ้างรอบการตรวจแบบไม่บังคับ เพราะแหล่งที่มาของความไม่สอดคล้องมีห้าแหล่ง</desc>

  <rect width="1280" height="728" fill="#ffffff"/>

