<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 1084" role="img" aria-labelledby="a2-title a2-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="a2-title">กรณีการใช้งานของโมดูลควบคุมเอกสาร</title>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap');</style>
  </defs>
  <desc id="a2-desc">แผนภาพกรณีการใช้งานแสดงขอบเขตโมดูลควบคุมเอกสารซึ่งบรรจุกรณีการใช้งานสิบสองรายการ ตั้งแต่การจัดทำร่างเอกสาร การส่งและตรวจรับคำขอดำเนินการเอกสาร การทบทวน การอนุมัติ การขึ้นทะเบียนประกาศใช้ การยกเลิกใช้งาน การค้นหา การมอบหมายและยืนยันรับทราบ การติดตามคำขอ จนถึงการตรวจครบถ้วนก่อนปิดคำขอ ผู้ทำการทางซ้ายคือเจ้าของเอกสาร ผู้ทบทวนตามการมอบหมาย ผู้อนุมัติตามการมอบหมาย และผู้มีสิทธิ์อ่าน ผู้ทำการทางขวาคือผู้คุมทะเบียนเอกสาร ผู้ได้รับมอบหมายรับทราบ และผู้เกี่ยวข้องตามสิทธิ์ เส้นประหมายถึงการเข้าถึงตามขอบเขตสิทธิ์อ่าน และกรอบสีส้มระบุอำนาจที่ยังรอยืนยัน</desc>

  <rect width="1000" height="1084" fill="#ffffff"/>

