<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" width="145mm" height="106.3mm">
  <rect x="0" y="0" width="1200" height="880" fill="#ffffff"/>
  <defs>
    <marker id="a8" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto">
      <path d="M0,0 L13,6.5 L0,13 z" fill="#334155"/>
    </marker>
    <marker id="a8p" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto">
      <path d="M0,0 L13,6.5 L0,13 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <text x="600" y="52" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="38" font-weight="700" fill="#0f172a">C2: Container Diagram ของระบบกลุ่ม B</text>

  <!-- users -->
  <rect x="40" y="120" width="220" height="130" rx="14" fill="#f1f5f9" stroke="#475569" stroke-width="4"/>
  <text x="150" y="170" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="32" font-weight="700" fill="#0f172a">ผู้ใช้งาน</text>
  <text x="150" y="208" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="26" fill="#475569">Admin · ISO/QA</text>
  <text x="150" y="240" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="26" fill="#475569">Auditor · CAR Owner</text>

  <!-- system boundary -->
  <rect x="300" y="100" width="620" height="700" rx="18" fill="none" stroke="#94a3b8" stroke-width="4" stroke-dasharray="16 10"/>
  <text x="320" y="140" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="28" font-weight="700" fill="#64748b">ขอบเขตระบบกลุ่ม B</text>

  <!-- SPA -->
  <rect x="340" y="160" width="540" height="120" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
  <text x="610" y="206" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="32" font-weight="700" fill="#1e3a8a">Web Application (Single Page Application)</text>
  <text x="610" y="246" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="28" fill="#1e3a8a">React</text>
  <text x="610" y="274" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="26" fill="#475569">หน้าจอ Records · Finding · CAR · Dashboard</text>

  <path d="M 262 185 L 335 195" stroke="#334155" stroke-width="4" marker-end="url(#a8)"/>

  <!-- API -->
  <rect x="340" y="330" width="540" height="180" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="4"/>
  <text x="610" y="374" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="32" font-weight="700" fill="#9a3412">API Application</text>
  <text x="610" y="410" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="28" fill="#9a3412">Node.js + Express + Prisma</text>
  <rect x="360" y="430" width="240" height="60" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
  <text x="480" y="468" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="26" fill="#9a3412">Record / Audit / CAR</text>
  <rect x="620" y="430" width="240" height="60" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
  <text x="740" y="468" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="26" fill="#9a3412">Dashboard Aggregator</text>

  <path d="M 610 282 L 610 325" stroke="#334155" stroke-width="4" marker-end="url(#a8)"/>
  <text x="630" y="312" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="26" fill="#334155">JSON/HTTPS</text>

  <!-- DB -->
  <rect x="340" y="580" width="250" height="180" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
  <text x="465" y="626" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="30" font-weight="700" fill="#14532d">Database</text>
  <text x="465" y="664" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="28" fill="#14532d">PostgreSQL</text>
  <text x="465" y="702" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="26" fill="#475569">Record · Finding · CAR</text>
  <text x="465" y="736" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="26" fill="#475569">Verification · AuditTrail</text>

  <!-- file storage -->
  <rect x="630" y="580" width="250" height="180" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
  <text x="755" y="626" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="30" font-weight="700" fill="#14532d">File Storage</text>
  <text x="755" y="668" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="26" fill="#475569">ไฟล์หลักฐานประกอบ</text>
  <text x="755" y="704" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="26" fill="#475569">(PDF/รูปภาพ)</text>
  <text x="755" y="740" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="26" fill="#475569">อ้างอิงด้วย file path</text>

  <path d="M 500 512 L 465 575" stroke="#334155" stroke-width="4" marker-end="url(#a8)"/>
  <text x="330" y="546" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="26" fill="#334155">SQL</text>
  <path d="M 720 512 L 755 575" stroke="#334155" stroke-width="4" marker-end="url(#a8)"/>
  <text x="790" y="546" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="26" fill="#334155">อ่าน/เขียนไฟล์</text>

  <!-- Group A -->
  <rect x="950" y="330" width="230" height="180" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="4"/>
  <text x="1065" y="378" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="30" font-weight="700" fill="#5b21b6">ระบบกลุ่ม A</text>
  <text x="1065" y="416" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="26" fill="#5b21b6">Document Control</text>
  <text x="1065" y="452" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="26" fill="#5b21b6">/ DAR / Ack</text>
  <text x="1065" y="488" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="26" fill="#6d28d9">(ระบบภายนอก)</text>

  <path d="M 945 400 L 885 400" stroke="#7c3aed" stroke-width="4" stroke-dasharray="10 6" marker-end="url(#a8p)"/>
  <text x="905" y="360" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="26" font-weight="700" fill="#7c3aed">Shared</text>
  <text x="905" y="330" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="26" font-weight="700" fill="#7c3aed">Contract</text>

  <!-- legend -->
  <rect x="40" y="740" width="250" height="120" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="60" y="782" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="26" font-weight="700" fill="#334155">คำอธิบาย</text>
  <line x1="60" y1="806" x2="120" y2="806" stroke="#334155" stroke-width="4"/>
  <text x="130" y="814" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="24" fill="#334155">ภายในระบบ</text>
  <line x1="60" y1="840" x2="120" y2="840" stroke="#7c3aed" stroke-width="4" stroke-dasharray="8 5"/>
  <text x="130" y="848" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="24" fill="#7c3aed">ข้ามระบบ (อ่านเท่านั้น)</text>
</svg>
