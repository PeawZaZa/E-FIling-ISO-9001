<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="145mm" height="108.75mm">
  <rect x="0" y="0" width="1200" height="900" fill="#ffffff"/>
  <defs>
    <marker id="a4" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 z" fill="#334155"/>
    </marker>
    <marker id="a4r" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- swimlane labels -->
  <rect x="20" y="20" width="220" height="270" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="3"/>
  <text x="130" y="150" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="32" font-weight="700" fill="#1e3a8a">การตรวจติดตาม</text>
  <text x="130" y="192" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="32" font-weight="700" fill="#1e3a8a">ภายใน</text>
  <text x="130" y="234" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="28" fill="#2563eb">QP-2301-0102</text>

  <rect x="20" y="320" width="220" height="550" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="3"/>
  <text x="130" y="540" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="32" font-weight="700" fill="#9a3412">การแก้ไข</text>
  <text x="130" y="582" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="32" font-weight="700" fill="#9a3412">และการป้องกัน</text>
  <text x="130" y="624" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="28" fill="#c2410c">QP-2301-0109</text>

  <!-- audit lane steps -->
  <rect x="270" y="40" width="270" height="100" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
  <text x="405" y="80" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="32" font-weight="700" fill="#1e3a8a">1. วางแผนการตรวจ</text>
  <text x="405" y="118" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="28" fill="#1e3a8a">(Audit Plan/Program)</text>

  <rect x="610" y="40" width="270" height="100" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
  <text x="745" y="80" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="32" font-weight="700" fill="#1e3a8a">2. ตรวจตามเช็กลิสต์</text>
  <text x="745" y="118" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="28" fill="#1e3a8a">(Audit Checklist)</text>

  <rect x="270" y="180" width="610" height="100" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
  <text x="575" y="220" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="32" font-weight="700" fill="#1e3a8a">3. บันทึกประเด็นที่พบ (Finding) พร้อมหลักฐานอ้างอิง</text>
  <text x="575" y="258" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="28" fill="#1e3a8a">ประเภท: NC Major · NC Minor · OFI · Observation</text>

  <path d="M 540 90 L 605 90" stroke="#334155" stroke-width="5" marker-end="url(#a4)"/>
  <path d="M 745 140 L 745 175" stroke="#334155" stroke-width="5" marker-end="url(#a4)"/>

  <!-- decision -->
  <polygon points="575,320 800,400 575,480 350,400" fill="#fef9c3" stroke="#ca8a04" stroke-width="4"/>
  <text x="575" y="388" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="32" font-weight="700" fill="#713f12">Finding ต้อง</text>
  <text x="575" y="428" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="32" font-weight="700" fill="#713f12">เปิด CAR หรือไม่</text>
  <path d="M 575 280 L 575 315" stroke="#334155" stroke-width="5" marker-end="url(#a4)"/>

  <!-- no branch -->
  <rect x="850" y="350" width="320" height="100" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="3"/>
  <text x="1010" y="390" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="30" fill="#334155">บันทึกไว้ใน Audit Summary</text>
  <text x="1010" y="428" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="30" fill="#334155">เพื่อติดตามต่อ</text>
  <path d="M 800 400 L 845 400" stroke="#334155" stroke-width="5" marker-end="url(#a4)"/>
  <text x="822" y="370" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="28" fill="#64748b">ไม่</text>

  <!-- CAR steps -->
  <rect x="350" y="520" width="450" height="100" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="4"/>
  <text x="575" y="560" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="32" font-weight="700" fill="#9a3412">4. เปิดใบ CAR จาก Finding</text>
  <text x="575" y="598" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="28" fill="#9a3412">กำหนดผู้รับผิดชอบ (Owner) และวันครบกำหนด (Due Date)</text>
  <path d="M 575 480 L 575 515" stroke="#334155" stroke-width="5" marker-end="url(#a4)"/>
  <text x="605" y="505" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="28" fill="#64748b">ใช่</text>

  <rect x="350" y="650" width="450" height="100" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="4"/>
  <text x="575" y="690" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="32" font-weight="700" fill="#9a3412">5. วิเคราะห์สาเหตุรากเหง้า และดำเนินการแก้ไข</text>
  <text x="575" y="728" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="28" fill="#9a3412">Root Cause · Corrective Action · แนบหลักฐาน</text>
  <path d="M 575 620 L 575 645" stroke="#334155" stroke-width="5" marker-end="url(#a4)"/>

  <rect x="350" y="780" width="450" height="90" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
  <text x="575" y="820" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="32" font-weight="700" fill="#14532d">6. ทวนสอบผลการแก้ไขและปิดงาน</text>
  <text x="575" y="856" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="28" fill="#14532d">Verification of Effectiveness → Closed</text>
  <path d="M 575 750 L 575 775" stroke="#334155" stroke-width="5" marker-end="url(#a4)"/>

  <!-- verify fail loop -->
  <path d="M 800 825 L 950 825 L 950 700 L 805 700" fill="none" stroke="#dc2626" stroke-width="5" stroke-dasharray="12 8" marker-end="url(#a4r)"/>
  <text x="960" y="770" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="28" font-weight="700" fill="#dc2626">ทวนสอบ</text>
  <text x="960" y="806" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="28" font-weight="700" fill="#dc2626">ไม่ผ่าน</text>

  <!-- overdue note -->
  <rect x="20" y="700" width="300" height="170" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="3" stroke-dasharray="10 6"/>
  <text x="170" y="746" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="30" font-weight="700" fill="#b91c1c">Overdue Monitoring</text>
  <text x="170" y="790" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="28" fill="#b91c1c">ระบบเทียบวันปัจจุบัน</text>
  <text x="170" y="826" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="28" fill="#b91c1c">กับ Due Date ของ CAR</text>
  <text x="170" y="862" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="28" fill="#b91c1c">ที่ยังไม่ปิดงาน</text>
</svg>
