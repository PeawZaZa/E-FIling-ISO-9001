<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="145mm" height="91.8mm">
  <rect x="0" y="0" width="1200" height="760" fill="#ffffff"/>
  <defs>
    <marker id="a11" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 z" fill="#334155"/>
    </marker>
  </defs>

  <text x="600" y="48" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="36" font-weight="700" fill="#0f172a">การรวบรวมข้อมูล (Data Aggregation) เพื่อแสดงผลบนแดชบอร์ดปฏิบัติการ</text>

  <!-- source layer -->
  <text x="150" y="110" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="30" font-weight="700" fill="#14532d">ข้อมูลธุรกรรม</text>
  <rect x="40" y="130" width="220" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="150" y="178" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="28" fill="#14532d">ตาราง records</text>
  <rect x="40" y="225" width="220" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="150" y="273" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="28" fill="#14532d">ตาราง findings</text>
  <rect x="40" y="320" width="220" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="150" y="368" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="28" fill="#14532d">ตาราง cars</text>
  <rect x="40" y="415" width="220" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="150" y="463" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="28" fill="#14532d">ตาราง audit_trail</text>
  <rect x="40" y="510" width="220" height="100" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/>
  <text x="150" y="552" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="28" fill="#5b21b6">ข้อมูลเอกสาร</text>
  <text x="150" y="588" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="26" fill="#6d28d9">และ Ack จากกลุ่ม A</text>

  <!-- aggregator -->
  <rect x="330" y="150" width="330" height="460" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="4"/>
  <text x="495" y="200" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="32" font-weight="700" fill="#9a3412">Dashboard Aggregator</text>
  <rect x="355" y="230" width="280" height="80" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
  <text x="495" y="266" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="26" font-weight="700" fill="#9a3412">นับจำนวน</text>
  <text x="495" y="298" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="26" fill="#475569">COUNT / GROUP BY status</text>
  <rect x="355" y="325" width="280" height="80" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
  <text x="495" y="361" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="26" font-weight="700" fill="#9a3412">คำนวณงานเกินกำหนด</text>
  <text x="495" y="393" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="24" fill="#475569">due_date &lt; today AND status ≠ Closed</text>
  <rect x="355" y="420" width="280" height="80" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
  <text x="495" y="456" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="26" font-weight="700" fill="#9a3412">จัดกลุ่มตามช่วงเวลา</text>
  <text x="495" y="488" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="24" fill="#475569">แนวโน้มรายเดือน (เปิด/ปิด)</text>
  <rect x="355" y="515" width="280" height="80" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
  <text x="495" y="551" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="26" font-weight="700" fill="#9a3412">คัดรายการล่าสุด</text>
  <text x="495" y="583" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="24" fill="#475569">ORDER BY + LIMIT</text>

  <path d="M 262 170 L 325 220" stroke="#334155" stroke-width="4" marker-end="url(#a11)"/>
  <path d="M 262 265 L 325 290" stroke="#334155" stroke-width="4" marker-end="url(#a11)"/>
  <path d="M 262 360 L 325 380" stroke="#334155" stroke-width="4" marker-end="url(#a11)"/>
  <path d="M 262 455 L 325 470" stroke="#334155" stroke-width="4" marker-end="url(#a11)"/>
  <path d="M 262 555 L 325 555" stroke="#7c3aed" stroke-width="4" stroke-dasharray="10 6" marker-end="url(#a11)"/>

  <!-- output -->
  <text x="930" y="110" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="30" font-weight="700" fill="#1e3a8a">ผลลัพธ์บนหน้าจอ</text>
  <rect x="720" y="130" width="440" height="120" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="940" y="176" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="28" font-weight="700" fill="#1e3a8a">Summary Cards</text>
  <text x="940" y="214" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="26" fill="#1e3a8a">Records · Finding เปิด/ปิด · CAR ค้าง · CAR เกินกำหนด</text>

  <rect x="720" y="265" width="440" height="160" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="940" y="308" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="28" font-weight="700" fill="#1e3a8a">Charts</text>
  <text x="940" y="346" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="26" fill="#1e3a8a">กราฟแท่ง: CAR แยกตามสถานะ</text>
  <text x="940" y="382" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="26" fill="#1e3a8a">กราฟวงกลม: สัดส่วน Finding ตามประเภท</text>
  <text x="940" y="416" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="26" fill="#1e3a8a">กราฟเส้น: แนวโน้ม CAR รายเดือน</text>

  <rect x="720" y="440" width="440" height="120" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="940" y="486" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="28" font-weight="700" fill="#1e3a8a">Recent Lists</text>
  <text x="940" y="524" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="26" fill="#1e3a8a">Finding ล่าสุด · CAR ใกล้ครบกำหนด · CAR เกินกำหนด</text>

  <rect x="720" y="575" width="440" height="120" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/>
  <text x="940" y="620" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="28" font-weight="700" fill="#5b21b6">Shared Data จากกลุ่ม A</text>
  <text x="940" y="658" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="26" fill="#5b21b6">อัตราการรับทราบเอกสาร · เอกสารที่ยังไม่รับทราบ · DAR ล่าสุด</text>

  <path d="M 662 300 L 715 190" stroke="#334155" stroke-width="4" marker-end="url(#a11)"/>
  <path d="M 662 370 L 715 340" stroke="#334155" stroke-width="4" marker-end="url(#a11)"/>
  <path d="M 662 460 L 715 490" stroke="#334155" stroke-width="4" marker-end="url(#a11)"/>
  <path d="M 662 555 L 715 620" stroke="#7c3aed" stroke-width="4" stroke-dasharray="10 6" marker-end="url(#a11)"/>

  <!-- note -->
  <text x="600" y="730" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="28" fill="#334155">ผู้ใช้สามารถคลิกที่กราฟหรือรายการเพื่อดูรายละเอียดเชิงลึก (Drill-down) ไปยังข้อมูลต้นทางได้</text>
</svg>
