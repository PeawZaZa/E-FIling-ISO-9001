  <polygon points="311,470 889,470 949,600 251,600" fill="#60a5fa" stroke="#1e3a8a" stroke-width="3"/>
  <text x="600" y="550" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="38" font-weight="700" fill="#0f172a">SD</text>
  <text x="980" y="545" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="34" font-weight="700" fill="#1e3a8a">เอกสารสนับสนุน</text>
  <text x="980" y="585" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="30" fill="#475569">(Support Document)</text>

  <!-- level 5 -->
  <polygon points="248,610 952,610 1012,740 188,740" fill="#bfdbfe" stroke="#1e3a8a" stroke-width="3"/>
  <text x="600" y="678" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="38" font-weight="700" fill="#0f172a">FM</text>
  <text x="600" y="718" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="30" fill="#1e3a8a">แบบฟอร์ม เช่น Audit Checklist · Audit Report · ใบ CAR</text>

  <!-- left annotation -->
  <text x="30" y="180" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="30" font-weight="700" fill="#b45309">กำหนดกรอบ</text>
  <text x="30" y="400" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="30" font-weight="700" fill="#b45309">กำหนดวิธีทำ</text>
