  <!-- level 3 -->
  <polygon points="374,330 826,330 886,460 314,460" fill="#3b82f6" stroke="#1e3a8a" stroke-width="3"/>
  <text x="600" y="410" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="38" font-weight="700" fill="#ffffff">WI</text>
  <text x="920" y="405" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="34" font-weight="700" fill="#1e3a8a">วิธีปฏิบัติงาน</text>
  <text x="920" y="445" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="30" fill="#475569">(Work Instruction)</text>

