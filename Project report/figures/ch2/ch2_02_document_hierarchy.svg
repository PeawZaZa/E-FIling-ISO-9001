<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="145mm" height="94.25mm">
  <rect x="0" y="0" width="1200" height="780" fill="#ffffff"/>

  <!-- level 1 -->
  <polygon points="600,40 760,180 440,180" fill="#1e40af" stroke="#1e3a8a" stroke-width="3"/>
