  <text x="800" y="130" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="34" font-weight="700" fill="#1e3a8a">คู่มือคุณภาพ (Quality Manual)</text>
  <text x="800" y="170" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="30" fill="#475569">ตัวอย่าง QM-2301-01 · อธิบายภาพรวมและขอบเขต QMS</text>

  <!-- level 2 -->
  <polygon points="437,190 763,190 823,320 377,320" fill="#2563eb" stroke="#1e3a8a" stroke-width="3"/>
  <text x="600" y="270" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="38" font-weight="700" fill="#ffffff">QP</text>
  <text x="860" y="255" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="34" font-weight="700" fill="#1e3a8a">ระเบียบปฏิบัติ (Quality Procedure)</text>
  <text x="860" y="295" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="30" fill="#475569">QP-2301-0102 การตรวจติดตามคุณภาพภายใน</text>
