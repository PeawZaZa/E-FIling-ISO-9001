  <text x="600" y="56" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="38" font-weight="700" fill="#0f172a">สถาปัตยกรรมเว็บแอปพลิเคชันแบบ 3 ชั้น และการแยกส่วนบริการ</text>

