<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="145mm" height="108.75mm">
  <rect x="0" y="0" width="1200" height="900" fill="#ffffff"/>

  <!-- outer ring -->
  <circle cx="600" cy="430" r="330" fill="none" stroke="#94a3b8" stroke-width="4" stroke-dasharray="14 10"/>

  <!-- PDCA quadrant boxes -->
  <g>
    <rect x="380" y="60" width="440" height="150" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
    <text x="600" y="112" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="42" font-weight="700" fill="#1e3a8a">P – Plan (วางแผน)</text>
    <text x="600" y="158" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="34" fill="#1e3a8a">ข้อ 4 บริบทองค์กร · ข้อ 5 ความเป็นผู้นำ</text>
    <text x="600" y="194" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="34" fill="#1e3a8a">ข้อ 6 การวางแผน</text>
  </g>

  <g>
    <rect x="880" y="330" width="300" height="200" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
    <text x="1030" y="386" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="42" font-weight="700" fill="#14532d">D – Do</text>
    <text x="1030" y="430" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="34" fill="#14532d">(ปฏิบัติ)</text>
    <text x="1030" y="474" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="34" fill="#14532d">ข้อ 7 การสนับสนุน</text>
    <text x="1030" y="512" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="34" fill="#14532d">ข้อ 8 การดำเนินการ</text>
  </g>

  <g>
    <rect x="380" y="660" width="440" height="180" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="6"/>
    <text x="600" y="714" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="42" font-weight="700" fill="#78350f">C – Check (ตรวจสอบ)</text>
    <text x="600" y="758" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="34" fill="#78350f">ข้อ 9 การประเมินสมรรถนะ</text>
    <text x="600" y="800" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="32" font-weight="700" fill="#b45309">9.2 การตรวจติดตามคุณภาพภายใน</text>
  </g>

  <g>
    <rect x="20" y="330" width="300" height="200" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="6"/>
    <text x="170" y="386" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="42" font-weight="700" fill="#7f1d1d">A – Act</text>
    <text x="170" y="430" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="34" fill="#7f1d1d">(ปรับปรุง)</text>
    <text x="170" y="474" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="34" fill="#7f1d1d">ข้อ 10 การปรับปรุง</text>
    <text x="170" y="512" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="32" font-weight="700" fill="#b91c1c">10.2 CAR</text>
  </g>

  <!-- center -->
  <circle cx="600" cy="430" r="170" fill="#f8fafc" stroke="#334155" stroke-width="4"/>
  <text x="600" y="400" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="40" font-weight="700" fill="#0f172a">ระบบบริหาร</text>
  <text x="600" y="446" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="40" font-weight="700" fill="#0f172a">งานคุณภาพ</text>
  <text x="600" y="492" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="36" fill="#334155">ISO 9001:2015</text>

  <!-- arrows around the circle -->
  <defs>
    <marker id="ah" markerWidth="12" markerHeight="12" refX="8" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#475569"/>
    </marker>
  </defs>
  <path d="M 820 150 A 330 330 0 0 1 950 330" fill="none" stroke="#475569" stroke-width="6" marker-end="url(#ah)"/>
  <path d="M 1000 540 A 330 330 0 0 1 830 700" fill="none" stroke="#475569" stroke-width="6" marker-end="url(#ah)"/>
  <path d="M 370 720 A 330 330 0 0 1 210 540" fill="none" stroke="#475569" stroke-width="6" marker-end="url(#ah)"/>
  <path d="M 190 320 A 330 330 0 0 1 360 160" fill="none" stroke="#475569" stroke-width="6" marker-end="url(#ah)"/>

  <!-- scope callout -->
  <rect x="20" y="20" width="330" height="120" rx="12" fill="#ffffff" stroke="#b45309" stroke-width="3" stroke-dasharray="10 6"/>
  <text x="40" y="66" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="32" font-weight="700" fill="#b45309">ขอบเขตของโครงงาน</text>
  <text x="40" y="106" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="32" fill="#b45309">ข้อ 9 และ ข้อ 10</text>
</svg>
