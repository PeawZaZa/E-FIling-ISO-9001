<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="145mm" height="104mm">
  <rect x="0" y="0" width="1200" height="860" fill="#ffffff"/>

  <!-- browser frame -->
  <rect x="30" y="30" width="1140" height="800" rx="14" fill="#ffffff" stroke="#334155" stroke-width="4"/>
  <rect x="30" y="30" width="1140" height="70" rx="14" fill="#f1f5f9" stroke="#334155" stroke-width="4"/>
  <circle cx="70" cy="65" r="12" fill="#ef4444"/>
  <circle cx="106" cy="65" r="12" fill="#f59e0b"/>
  <circle cx="142" cy="65" r="12" fill="#22c55e"/>
  <text x="600" y="76" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="30" font-weight="700" fill="#0f172a">แดชบอร์ดปฏิบัติการ — ระบบทะเบียนหลักฐาน การตรวจติดตามภายใน และ CAR</text>

  <!-- section 1 : cards -->
  <text x="60" y="140" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="28" font-weight="700" fill="#1e3a8a">(1) Summary Cards</text>
  <g>
    <rect x="55" y="155" width="205" height="130" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <text x="157" y="200" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="26" fill="#1e3a8a">Records ทั้งหมด</text>
    <text x="157" y="255" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="46" font-weight="700" fill="#1e3a8a">248</text>

    <rect x="277" y="155" width="205" height="130" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="3"/>
    <text x="379" y="200" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="26" fill="#713f12">Finding ที่เปิดอยู่</text>
    <text x="379" y="255" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="46" font-weight="700" fill="#713f12">17</text>

    <rect x="499" y="155" width="205" height="130" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
    <text x="601" y="200" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="26" fill="#9a3412">CAR ที่ยังไม่ปิด</text>
    <text x="601" y="255" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="46" font-weight="700" fill="#9a3412">9</text>

    <rect x="721" y="155" width="205" height="130" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
    <text x="823" y="200" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="26" fill="#b91c1c">CAR เกินกำหนด</text>
    <text x="823" y="255" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="46" font-weight="700" fill="#b91c1c">3</text>

    <rect x="943" y="155" width="205" height="130" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/>
    <text x="1045" y="196" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="26" fill="#5b21b6">DAR ที่เชื่อมโยง</text>
    <text x="1045" y="226" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="22" fill="#6d28d9">(จากกลุ่ม A)</text>
    <text x="1045" y="270" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="40" font-weight="700" fill="#5b21b6">12</text>
  </g>

  <!-- section 2 : charts -->
  <text x="60" y="330" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="28" font-weight="700" fill="#1e3a8a">(2) Charts</text>
  <rect x="55" y="345" width="340" height="230" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
  <text x="225" y="382" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="26" font-weight="700" fill="#334155">CAR แยกตามสถานะ</text>
  <line x1="90" y1="545" x2="370" y2="545" stroke="#94a3b8" stroke-width="3"/>
  <rect x="110" y="450" width="45" height="95" fill="#2563eb"/>
  <rect x="175" y="415" width="45" height="130" fill="#ea580c"/>
  <rect x="240" y="480" width="45" height="65" fill="#ca8a04"/>
  <rect x="305" y="400" width="45" height="145" fill="#16a34a"/>
  <text x="132" y="570" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="20" fill="#475569">Open</text>
  <text x="197" y="570" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="20" fill="#475569">In Prog.</text>
  <text x="262" y="570" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="20" fill="#475569">Pending</text>
  <text x="327" y="570" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="20" fill="#475569">Closed</text>

  <rect x="415" y="345" width="330" height="230" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
  <text x="580" y="382" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="26" font-weight="700" fill="#334155">สัดส่วน Finding ตามประเภท</text>
  <circle cx="545" cy="480" r="72" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <path d="M 545 480 L 545 408 A 72 72 0 0 1 612 455 z" fill="#ea580c"/>
  <path d="M 545 480 L 612 455 A 72 72 0 0 1 596 534 z" fill="#ca8a04"/>
  <text x="660" y="452" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="22" fill="#475569">NC Major</text>
  <text x="660" y="486" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="22" fill="#475569">NC Minor</text>
  <text x="660" y="520" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="22" fill="#475569">OFI</text>

  <rect x="765" y="345" width="383" height="230" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
  <text x="956" y="382" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="26" font-weight="700" fill="#334155">แนวโน้ม CAR เปิด–ปิด รายเดือน</text>
  <line x1="800" y1="545" x2="1120" y2="545" stroke="#94a3b8" stroke-width="3"/>
  <polyline points="810,520 870,480 930,495 990,440 1050,455 1110,415" fill="none" stroke="#ea580c" stroke-width="4"/>
  <polyline points="810,535 870,510 930,470 990,485 1050,430 1110,440" fill="none" stroke="#16a34a" stroke-width="4"/>
  <text x="820" y="570" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="20" fill="#475569">ม.ค. – มิ.ย.</text>
  <line x1="990" y1="565" x2="1030" y2="565" stroke="#ea580c" stroke-width="4"/>
  <text x="1038" y="572" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="20" fill="#475569">เปิด</text>
  <line x1="990" y1="590" x2="1030" y2="590" stroke="#16a34a" stroke-width="4"/>
  <text x="1038" y="597" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="20" fill="#475569">ปิด</text>

  <!-- section 3+4 -->
  <text x="60" y="640" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="28" font-weight="700" fill="#1e3a8a">(3) Shared Data จากกลุ่ม A</text>
  <rect x="55" y="655" width="500" height="155" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/>
  <text x="80" y="700" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="26" fill="#5b21b6">อัตราการรับทราบเอกสาร SOP/WI</text>
  <rect x="80" y="715" width="380" height="26" rx="8" fill="#ddd6fe"/>
  <rect x="80" y="715" width="290" height="26" rx="8" fill="#7c3aed"/>
  <text x="475" y="738" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="26" font-weight="700" fill="#5b21b6">76%</text>
  <text x="80" y="782" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="26" fill="#5b21b6">เอกสารที่ยังไม่รับทราบ 14 ฉบับ · DAR ล่าสุด 3 รายการ</text>

  <text x="590" y="640" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="28" font-weight="700" fill="#1e3a8a">(4) Recent Lists</text>
  <rect x="585" y="655" width="563" height="155" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
  <line x1="585" y1="700" x2="1148" y2="700" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="585" y1="745" x2="1148" y2="745" stroke="#cbd5e1" stroke-width="2"/>
  <text x="605" y="688" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="24" font-weight="700" fill="#334155">รหัส</text>
  <text x="720" y="688" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="24" font-weight="700" fill="#334155">ประเด็น/ผู้รับผิดชอบ</text>
  <text x="1000" y="688" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="24" font-weight="700" fill="#334155">ครบกำหนด</text>
  <text x="605" y="732" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="24" fill="#b91c1c">CAR-011</text>
  <text x="720" y="732" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="24" fill="#b91c1c">เอกสารไม่เป็นฉบับปัจจุบัน</text>
  <text x="1000" y="732" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="24" font-weight="700" fill="#b91c1c">เกิน 5 วัน</text>
  <text x="605" y="778" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="24" fill="#334155">CAR-014</text>
  <text x="720" y="778" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="24" fill="#334155">หลักฐานการอบรมไม่ครบ</text>
  <text x="1000" y="778" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="24" fill="#ca8a04">อีก 2 วัน</text>
</svg>
