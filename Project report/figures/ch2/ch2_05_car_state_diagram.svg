<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="145mm" height="82.2mm">
  <rect x="0" y="0" width="1200" height="680" fill="#ffffff"/>
  <defs>
    <marker id="a5" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 z" fill="#1e293b"/>
    </marker>
    <marker id="a5r" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- start -->
  <circle cx="70" cy="250" r="26" fill="#1e293b"/>
  <path d="M 100 250 L 155 250" stroke="#1e293b" stroke-width="5" marker-end="url(#a5)"/>

  <!-- Open -->
  <rect x="160" y="180" width="230" height="140" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="5"/>
  <text x="275" y="238" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="40" font-weight="700" fill="#1e3a8a">Open</text>
  <text x="275" y="284" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="30" fill="#1e3a8a">เปิดใบคำร้อง</text>

  <!-- In Progress -->
  <rect x="470" y="180" width="250" height="140" rx="20" fill="#ffedd5" stroke="#ea580c" stroke-width="5"/>
  <text x="595" y="238" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="40" font-weight="700" fill="#9a3412">In Progress</text>
  <text x="595" y="284" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="30" fill="#9a3412">กำลังดำเนินการแก้ไข</text>

  <!-- Pending Verify -->
  <rect x="800" y="180" width="250" height="140" rx="20" fill="#fef9c3" stroke="#ca8a04" stroke-width="5"/>
  <text x="925" y="238" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="40" font-weight="700" fill="#713f12">Pending Verify</text>
  <text x="925" y="284" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="30" fill="#713f12">รอการทวนสอบหลักฐาน</text>

  <!-- Closed -->
  <rect x="800" y="470" width="250" height="140" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="5"/>
  <text x="925" y="528" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="40" font-weight="700" fill="#14532d">Closed</text>
  <text x="925" y="574" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="30" fill="#14532d">ปิดการแก้ไข</text>

  <!-- final -->
  <circle cx="1140" cy="540" r="26" fill="none" stroke="#1e293b" stroke-width="5"/>
  <circle cx="1140" cy="540" r="15" fill="#1e293b"/>
  <path d="M 1055 540 L 1108 540" stroke="#1e293b" stroke-width="5" marker-end="url(#a5)"/>

  <!-- transitions -->
  <path d="M 392 250 L 465 250" stroke="#1e293b" stroke-width="5" marker-end="url(#a5)"/>
  <text x="428" y="150" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="28" font-weight="700" fill="#1e293b">บันทึก Root Cause</text>
  <text x="428" y="186" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="28" fill="#475569">[CAR Owner]</text>

  <path d="M 722 250 L 795 250" stroke="#1e293b" stroke-width="5" marker-end="url(#a5)"/>
  <text x="758" y="150" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="28" font-weight="700" fill="#1e293b">ส่งทวนสอบ</text>
  <text x="758" y="186" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="28" fill="#475569">[แนบหลักฐานครบ]</text>

  <path d="M 925 322 L 925 465" stroke="#1e293b" stroke-width="5" marker-end="url(#a5)"/>
  <text x="945" y="380" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="28" font-weight="700" fill="#1e293b">ทวนสอบผ่าน</text>
  <text x="945" y="416" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="28" fill="#475569">[ISO/QA หรือ Auditor]</text>

  <!-- verify fail: back to In Progress -->
  <path d="M 800 290 L 700 330 L 595 330 L 595 322" fill="none" stroke="#dc2626" stroke-width="5" stroke-dasharray="12 8" marker-end="url(#a5r)"/>
  <text x="640" y="392" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="28" font-weight="700" fill="#dc2626">ทวนสอบไม่ผ่าน (Reopen)</text>
  <text x="640" y="428" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="28" fill="#dc2626">กลับไปแก้ไขเพิ่มเติม</text>

  <!-- overdue flag -->
  <rect x="160" y="440" width="420" height="180" rx="14" fill="#ffffff" stroke="#dc2626" stroke-width="4" stroke-dasharray="10 6"/>
  <text x="370" y="488" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="32" font-weight="700" fill="#b91c1c">Overdue เป็นสถานะประกอบ</text>
  <text x="370" y="532" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="28" fill="#b91c1c">ไม่ใช่สถานะหลักของ CAR</text>
  <text x="370" y="572" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="28" fill="#b91c1c">ระบบคำนวณจาก due_date &lt; วันปัจจุบัน</text>
  <text x="370" y="608" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="28" fill="#b91c1c">และสถานะยังไม่เป็น Closed</text>
  <path d="M 380 440 L 380 330 L 470 285" fill="none" stroke="#dc2626" stroke-width="4" stroke-dasharray="8 6"/>

  <!-- guard note -->
  <rect x="20" y="20" width="1160" height="80" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="3"/>
  <text x="600" y="72" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="36" font-weight="700" fill="#0f172a">วงจรสถานะของใบคำร้องขอให้ดำเนินการแก้ไข (CAR Lifecycle) — ระบบไม่อนุญาตให้ข้ามสถานะ</text>
</svg>
