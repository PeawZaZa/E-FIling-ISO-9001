<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="145mm" height="91.8mm">
  <rect x="0" y="0" width="1200" height="760" fill="#ffffff"/>
  <defs>
    <marker id="a6" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto">
      <path d="M0,0 L13,6.5 L0,13 z" fill="#334155"/>
    </marker>
  </defs>

  <text x="600" y="58" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="38" font-weight="700" fill="#0f172a">การควบคุมสิทธิ์การเข้าถึงตามบทบาท (Role-Based Access Control)</text>

  <!-- column headers -->
  <text x="180" y="130" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="34" font-weight="700" fill="#1e3a8a">ผู้ใช้ (User)</text>
  <text x="600" y="130" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="34" font-weight="700" fill="#9a3412">บทบาท (Role)</text>
  <text x="1010" y="130" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="34" font-weight="700" fill="#14532d">สิทธิ์ (Permission)</text>

  <!-- users -->
  <rect x="60" y="170" width="240" height="80" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="180" y="220" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="30" fill="#1e3a8a">เจ้าหน้าที่ ISO/QA</text>
  <rect x="60" y="270" width="240" height="80" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="180" y="320" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="30" fill="#1e3a8a">ผู้ตรวจติดตาม</text>
  <rect x="60" y="370" width="240" height="80" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="180" y="420" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="30" fill="#1e3a8a">หัวหน้างานที่ถูกตรวจ</text>
  <rect x="60" y="470" width="240" height="80" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="180" y="520" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="30" fill="#1e3a8a">ผู้ดูแลระบบ</text>

  <!-- roles -->
  <rect x="440" y="170" width="320" height="80" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="4"/>
  <text x="600" y="220" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="32" font-weight="700" fill="#9a3412">ISO/QA User</text>
  <rect x="440" y="270" width="320" height="80" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="4"/>
  <text x="600" y="320" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="32" font-weight="700" fill="#9a3412">Auditor</text>
  <rect x="440" y="370" width="320" height="80" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="4"/>
  <text x="600" y="420" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="32" font-weight="700" fill="#9a3412">CAR Owner</text>
  <rect x="440" y="470" width="320" height="80" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="4"/>
  <text x="600" y="520" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="32" font-weight="700" fill="#9a3412">Admin</text>

  <!-- permissions -->
  <rect x="850" y="160" width="300" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="1000" y="204" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="28" fill="#14532d">จัดการ Record/หลักฐาน</text>
  <rect x="850" y="245" width="300" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="1000" y="289" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="28" fill="#14532d">บันทึก Finding</text>
  <rect x="850" y="330" width="300" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="1000" y="374" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="28" fill="#14532d">เปิดใบ CAR</text>
  <rect x="850" y="415" width="300" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="1000" y="459" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="28" fill="#14532d">อัปเดต Root Cause/Action</text>
  <rect x="850" y="500" width="300" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="1000" y="544" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="28" fill="#14532d">ทวนสอบและปิดงาน</text>
  <rect x="850" y="585" width="300" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="1000" y="629" text-anchor="middle" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="28" fill="#14532d">จัดการผู้ใช้/ดู Audit Trail</text>

  <!-- user to role -->
  <path d="M 302 210 L 435 210" stroke="#334155" stroke-width="4" marker-end="url(#a6)"/>
  <path d="M 302 310 L 435 310" stroke="#334155" stroke-width="4" marker-end="url(#a6)"/>
  <path d="M 302 410 L 435 410" stroke="#334155" stroke-width="4" marker-end="url(#a6)"/>
  <path d="M 302 510 L 435 510" stroke="#334155" stroke-width="4" marker-end="url(#a6)"/>

  <!-- role to permission -->
  <path d="M 762 200 L 845 195" stroke="#334155" stroke-width="4" marker-end="url(#a6)"/>
  <path d="M 762 215 L 845 360" stroke="#334155" stroke-width="4" marker-end="url(#a6)"/>
  <path d="M 762 230 L 845 530" stroke="#334155" stroke-width="4" marker-end="url(#a6)"/>
  <path d="M 762 300 L 845 285" stroke="#334155" stroke-width="4" marker-end="url(#a6)"/>
  <path d="M 762 320 L 845 355" stroke="#334155" stroke-width="4" marker-end="url(#a6)"/>
  <path d="M 762 410 L 845 445" stroke="#334155" stroke-width="4" marker-end="url(#a6)"/>
  <path d="M 762 510 L 845 615" stroke="#334155" stroke-width="4" marker-end="url(#a6)"/>

  <!-- principle notes -->
  <rect x="60" y="600" width="700" height="130" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/>
  <text x="90" y="646" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="30" font-weight="700" fill="#0f172a">หลักการที่ระบบยึด</text>
  <text x="90" y="686" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="28" fill="#334155">1) ให้สิทธิ์เท่าที่จำเป็น (Least Privilege)</text>
  <text x="90" y="722" font-family="TH Sarabun New,Sarabun,Tahoma,sans-serif" font-size="28" fill="#334155">2) แยกหน้าที่ (Separation of Duty): ผู้แก้ไข CAR ต้องไม่ใช่ผู้ทวนสอบและปิดงาน</text>
</svg>
