<text x="44" y="838" class="small">ผู้บริหารดูเฉพาะค่าสรุปภาพรวม ไม่เจาะลึกรายบุคคล; ผู้รับผิดชอบดูข้อมูลในขอบเขตของตน</text>
<text x="44" y="866" class="small">ผู้ช่วย QMR ใช้สิทธิ์ในภาพนี้แทน QMR ได้เฉพาะเมื่อได้รับมอบหมาย ตาม §B.2.5</text>
