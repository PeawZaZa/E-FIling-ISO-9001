<text x="44" y="806" class="small">เส้นทึบ = Association / การมีส่วนร่วม · ไม่ใช่ลำดับงาน และไม่ใช่การให้สิทธิ์แบบไม่มีเงื่อนไข</text>
<text x="44" y="838" class="small">Lead Auditor อนุมัติแผนเฉพาะ CAR; ผู้ตรวจติดตามตรวจประสิทธิผลเฉพาะใบที่ตนเป็นผู้แจ้ง</text>
<text x="44" y="866" class="small">ผู้ช่วย QMR ใช้สิทธิ์แทนได้เมื่อได้รับมอบหมาย และบันทึกการกระทำในนามตนเอง</text>
<text x="44" y="894" class="small">รอยืนยัน: BR-B-12 / AC-B-19 และจำนวนผู้ลงนามปิดใบยังไม่ตรงกัน; เส้นไม่ตัดสินว่าใช้หนึ่งหรือสองคน</text>
<text x="44" y="922" class="small">ผู้รับผิดชอบการแก้ไข ≠ ผู้ตรวจสอบประสิทธิผล ≠ ผู้ปิดใบ ต้องเป็นคนละบุคคล</text>
