acceptance:
  AC-01:
    id: AC-01
    given: มี Document Draft ที่กรอก metadata ครบ
    when: Document Owner สร้าง/บันทึกเอกสารพร้อมไฟล์แนบ
    then: สร้าง document draft และแนบไฟล์ได้สำเร็จ
    requirements:
      - FR-A01
      - FR-A02
      - FR-A03
    useCases:
      - UC-01
  AC-02:
    id: AC-02
    given: มี Document ที่ต้องการแก้ไข/ยกเลิก
    when: Document Owner submit DAR แล้ว Approver ตัดสินใจ
    then: DAR flow ทำได้อย่างน้อย submit → review/approve/reject
    requirements:
      - FR-A05
      - FR-A06
    useCases:
      - UC-02
      - UC-03
  AC-03:
    id: AC-03
    given: Document อยู่ในสถานะ Approved
    when: ISO Admin publish เอกสาร
    then: ผู้ใช้เห็น current version ได้
    requirements:
      - FR-A04
      - FR-A07
    useCases:
      - UC-04
  AC-04:
    id: AC-04
    given: Document ถูก obsolete
    when: End User ทั่วไปเปิดดูเอกสาร
    then: ผู้ใช้ทั่วไปไม่เห็นเป็นฉบับใช้งาน
    requirements:
      - FR-A04
      - FR-A07
      - FR-A08
    useCases:
      - UC-05
  AC-05:
    id: AC-05
    given: มี current document ที่มอบหมายให้รับทราบ
    when: End User กดรับทราบ
    then: acknowledgement เก็บ user/time/document version ได้
    requirements:
      - FR-A10
      - FR-A11
    useCases:
      - UC-07
  AC-06:
    id: AC-06
    given: มี document_id, finding_id หรือ car_id อย่างน้อยหนึ่งรายการที่ต้องการอ้างอิง
    when: ISO User/CAR Owner สร้าง record พร้อมแนบไฟล์ (หนึ่งไฟล์ขึ้นไป)
    then: record/evidence ผูกกับ document, finding หรือ CAR ได้อย่างน้อยหนึ่งรายการ และรองรับไฟล์แนบหลายไฟล์ผ่าน RecordFile
    requirements:
      - FR-B01
      - FR-B02
      - FR-B16
      - FR-B17
    useCases:
      - UC-08
  AC-07:
    id: AC-07
    given: มี evidence หรือ document ที่เกี่ยวข้อง
    when: Auditor สร้าง finding
    then: finding ผูกกับ evidence หรือ document ได้
    requirements:
      - FR-B03
      - FR-B04
      - FR-B05
    useCases:
      - UC-09
  AC-08:
    id: AC-08
    given: มี finding ที่ต้องดำเนินการแก้ไข
    when: ISO Admin/Auditor เปิด CAR และ CAR Owner ดำเนินการ
    then: CAR ผูกกับ finding และมี due date/status/owner ได้
    requirements:
      - FR-B06
      - FR-B07
      - FR-B08
      - FR-B09
      - FR-B10
    useCases:
      - UC-10
      - UC-11
  AC-09:
    id: AC-09
    given: มีข้อมูล document/ack/CAR/finding ในระบบจริง
    when: ผู้ใช้เปิด dashboard
    then: dashboard แสดง document status, acknowledgement, CAR status, overdue ได้จากฐานข้อมูลจริง
    requirements:
      - FR-B11
      - FR-B12
      - FR-B13
    useCases:
      - UC-12
  AC-10:
    id: AC-10
    given: มี document ที่เชื่อมกับ record/finding/CAR
    when: ผู้ใช้ตรวจสอบ traceability
    then: มี traceability จาก document → record/finding/CAR และจาก CAR → evidence
    requirements:
      - FR-A08
    useCases: []
  AC-11:
    id: AC-11
    given: มีเอกสาร Obsolete ที่เก็บครบ ≥1 Revision หรือบันทึกคุณภาพที่ Retention Clock ครบกำหนด
    when: ISO/QA Admin ยื่นคำร้องขอทำลายและได้รับอนุมัติจาก QMR/ผู้อนุมัติ
    then: ระบบทำลายเฉพาะรายการที่อนุมัติแล้ว (Hard Delete) และบันทึก Destruction Log ครบถ้วน
    requirements:
      - FR-A13
    useCases:
      - UC-15
  AC-12:
    id: AC-12
    given: มีเอกสาร Published ที่ถูกเปิด preview/ดาวน์โหลด/พิมพ์
    when: ผู้ใช้เปิดดู/ดาวน์โหลด/พิมพ์เอกสารดังกล่าว
    then: ระบบแสดงป้ายกำกับ/ลายน้ำ "สำเนาไม่ควบคุม / Uncontrolled Copy" ทุกช่องทางเสมอ
    requirements:
      - FR-A15
    useCases:
      - UC-06
  AC-13:
    id: AC-13
    given: End User/Document Owner/Approver มีงาน DAR หรือ Acknowledgement ค้างที่ผูกกับตนเอง
    when: ผู้ใช้เปิดเมนู "งานของฉัน (My Task Checklist)"
    then: ระบบแสดงเฉพาะงานค้างของผู้ใช้เอง แยกจาก Operational Dashboard รวมของ Group B โดยสมบูรณ์
    requirements:
      - FR-A16
    useCases:
      - UC-16
