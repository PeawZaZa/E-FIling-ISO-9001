    - จะแสดงว่ายังไม่มีเอกสารวัตถุประสงค์รองรับ ซึ่งเป็นความจริงไม่ใช่ข้อผิดพลาด
objectives:
  OBJ-1.2.1:
    text: พัฒนาระบบจัดเก็บบันทึกข้อมูลและหลักฐานที่เกี่ยวข้องกับระบบบริหารงานคุณภาพในฐานข้อมูลกลาง
    source: บทที่ 1 ข้อ 1.2.1 และแบบเสนอหัวข้อ SE02 ข้อ 11.1
    group: B
    useCases:
      - UC-08
  OBJ-1.2.2:
    text: พัฒนาระบบบันทึกประเด็นที่พบจากการตรวจติดตาม พร้อมหลักฐานอ้างอิง และสรุปผลการตรวจติดตามภายในเบื้องต้น
    source: บทที่ 1 ข้อ 1.2.2 และแบบเสนอหัวข้อ SE02 ข้อ 11.1
    group: B
    useCases:
      - UC-09
      - UC-13
  OBJ-1.2.3:
    text: พัฒนาระบบบริหารจัดการใบคำร้องขอให้ดำเนินการแก้ไข ตั้งแต่การเปิดใบจนถึงการปิดงาน
    source: บทที่ 1 ข้อ 1.2.3 และแบบเสนอหัวข้อ SE02 ข้อ 11.1
    group: B
    useCases:
      - UC-10
      - UC-11
  OBJ-1.2.4:
    text: พัฒนาระบบติดตามกำหนดเวลาและคำนวณสถานะงานที่เกินกำหนดโดยอัตโนมัติ
    source: บทที่ 1 ข้อ 1.2.4 และแบบเสนอหัวข้อ SE02 ข้อ 11.1
    group: B
    useCases:
      - UC-12
stakeholders:
  ผู้บริหาร/สำนักงานคณบดี:
    name: ผู้บริหาร/สำนักงานคณบดี (Sponsor)
    authorityBoundary: ไม่ปฏิบัติงานในระบบโดยตรง (ดู Dashboard)
  ISO/QA Admin:
    name: ISO/QA Admin (DCC — Document Control Center/Coordinator)
    authorityBoundary: Publish/Obsolete เอกสาร เฉพาะหลังได้รับอนุมัติจาก Approver แล้วเท่านั้น, เปิด CAR, ดูภาพรวมทั้งระบบ, จัดการบัญชีผู้ใช้และสิทธิ์พื้นฐาน; ห้ามทำหน้าที่ Approver เอง (Segregation of Duties ตาม TBD-EFL-04)
  Document Owner:
    name: Document Owner
    authorityBoundary: แก้ไขเฉพาะเอกสารของตน; ไม่ approve เอง
  Approver:
    name: Approver
    authorityBoundary: อนุมัติได้เฉพาะที่ได้รับมอบหมาย; แยกขาดจาก ISO Admin/DCC โดยเด็ดขาด — ไม่มีสิทธิ์ Publish เอง
  QMR:
    name: QMR (ผู้แทนฝ่ายบริหาร / Management Representative)
    authorityBoundary: มีสิทธิ์ Close CAR ร่วมกับ Lead Auditor (ดู TBD-EFL-07); ไม่ทำหน้าที่ Publish เอกสาร
  End User:
    name: End User
    authorityBoundary: อ่าน/รับทราบเท่านั้น; ไม่แก้ไขเอกสาร
  Auditor:
    name: Auditor (ผู้ตรวจ/ผู้แจ้งพบข้อบกพร่อง)
    authorityBoundary: สร้าง finding/CAR; มีสิทธิ์ Verify CAR เฉพาะกรณีเป็นผู้แจ้งพบข้อบกพร่องนั้นเอง; ไม่มีสิทธิ์ Close CAR เว้นแต่เป็น Lead Auditor
  Lead Auditor:
    name: Lead Auditor (ผู้ตรวจประเมินหลักประจำรอบ/คณะ)
    authorityBoundary: มีสิทธิ์ Close CAR ร่วมกับ QMR (Two-Step Authorization ตาม TBD-EFL-07)
  Assistant DCC:
    name: Assistant DCC (ผู้ช่วยเลขานุการคณะกรรมการระบบคุณภาพ)
    authorityBoundary: มีสิทธิ์ Verify CAR; ไม่มีสิทธิ์ Close CAR (แยกจากผู้ Close ตาม Segregation of Duties)
  CAR Owner:
    name: CAR Owner
    authorityBoundary: แก้ไขเฉพาะ CAR ที่ตนรับผิดชอบ; ไม่มีสิทธิ์ Verify/Close CAR ของตนเอง
  Student Group A / Group B:
    name: Student Group A / Group B (Delivery Team)
    authorityBoundary: Group A ห้ามทำ Record/Finding/CAR/Dashboard หลัก; Group B ห้ามทำ Document Master/DAR Approval/Ack Assignment (ดู §2.5 และ Appendix B.5)
