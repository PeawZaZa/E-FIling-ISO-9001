requirements:
  FR-A01:
    id: FR-A01
    text: ระบบต้องสร้าง แก้ไข แสดง และค้นหา document master ได้
    priority: Must
    group: A
    useCases:
      - UC-01
  FR-A02:
    id: FR-A02
    text: "ระบบต้องเก็บ metadata: document_code, title, type, department, owner, approver, version, status"
    priority: Must
    group: A
    useCases:
      - UC-01
  FR-A03:
    id: FR-A03
    text: ระบบต้อง upload/download ไฟล์เอกสารได้ พร้อมตรวจสอบขนาดไฟล์สูงสุดตามประเภทเอกสาร (BRULE-EFL-27)
    priority: Must
    group: A
    useCases:
      - UC-01
  FR-A05:
    id: FR-A05
    text: ระบบต้องสร้าง DAR พร้อม action type ครบ 4 ประเภท (CREATE / AMEND / CANCEL / REQUEST_UNCONTROLLED) และ reason ได้ — ปรับปรุงตามมติผู้ใช้อ้างอิง QP-2301-0107 ข้อ 6.5.1 (REF-13) แทนที่แนวทางเดิมที่เคยพิจารณาเพิ่มประเภท hold/cancel-hold
    priority: Must
    group: A
    useCases:
      - UC-02
  FR-A06:
    id: FR-A06
    text: ระบบต้องมี approval queue และ approve/reject พร้อม comment
    priority: Must
    group: A
    useCases:
      - UC-03
  FR-A04:
    id: FR-A04
    text: ระบบต้องควบคุมสถานะ Draft/Review/Approved/Published/Obsolete
    priority: Must
    group: A
    useCases:
      - UC-04
      - UC-05
  FR-A07:
    id: FR-A07
    text: ระบบต้อง publish current version ได้เพียงหนึ่งฉบับ (และตั้ง Obsolete รุ่นก่อนหน้าอัตโนมัติ)
    priority: Must
    group: A
    useCases:
      - UC-04
      - UC-05
  FR-A08:
    id: FR-A08
    text: ระบบต้องบันทึก revision history ของเอกสาร (เข้าถึงได้จำกัดสิทธิ์ผ่าน Alternate Flow A1)
    priority: Must
    group: A
    useCases:
      - UC-04
      - UC-05
  FR-A09:
    id: FR-A09
    text: ระบบต้องค้นหาด้วย code/title/type/department ได้
    priority: Must
    group: A
    useCases:
      - UC-06
  FR-A15:
    id: FR-A15
    text: ระบบต้องแสดงป้ายกำกับ/ลายน้ำ "สำเนาไม่ควบคุม / Uncontrolled Copy" บนหน้าพรีวิว ไฟล์ดาวน์โหลด และผลพิมพ์ของเอกสาร Published ทุกครั้ง (มติผู้ใช้ อ้างอิง QP-2301-0107 ข้อ 6.6, REF-13)
    priority: Must
    group: A
    useCases:
      - UC-06
  FR-A10:
    id: FR-A10
    text: ระบบต้องกำหนดกลุ่มเป้าหมายผู้รับทราบเอกสารได้ทั้งแบบแผนก/บทบาท และเจาะจงรายบุคคล (Dual Mapping) — สถาปัตยกรรมยืนยันแล้วจาก TBD-EFL-05 RESOLVED เพื่อลด Alert Fatigue
    priority: Should (ตามเอกสารต้นทาง)
    group: A
    useCases:
      - UC-07
  FR-A11:
    id: FR-A11
    text: ระบบต้องบันทึก acknowledgement user/time/document version
    priority: Must
    group: A
    useCases:
      - UC-07
  FR-B01:
    id: FR-B01
    text: ระบบต้องสร้าง/แก้ไข/ค้นหา record ได้
    priority: Must
    group: B
    useCases:
      - UC-08
  FR-B02:
    id: FR-B02
    text: ระบบต้องแนบ evidence file และผูกกับ document_id, finding_id หรือ car_id ได้อย่างน้อยหนึ่งรายการ (ปรับปรุงให้สอดคล้องกับ BRULE-EFL-06 และ Direct Issue Linkage)
    priority: Must
    group: B
    useCases:
      - UC-08
  FR-B16:
    id: FR-B16
    text: ระบบต้องรองรับการแนบไฟล์หลักฐานมากกว่า 1 ไฟล์ต่อ record เดียว (Multi-File Attachment ผ่าน Entity RecordFile)
    priority: Must
    group: B
    useCases:
      - UC-08
  FR-B17:
    id: FR-B17
    text: ระบบต้องรองรับการผูก record เข้ากับ finding_id หรือ car_id ได้โดยตรงโดยไม่บังคับต้องมี document_id (Direct Issue Linkage — document_id เป็น Nullable)
    priority: Must
    group: B
    useCases:
      - UC-08
  FR-B03:
    id: FR-B03
    text: ระบบควรสร้าง audit header หรือ AuditRound ได้ (Single Header ต่อรอบปี ผูก Lead Auditor และ Finding/NC เป็น Child Record — สถาปัตยกรรมยืนยันแล้วจาก TBD-EFL-06 RESOLVED)
    priority: Should (ตามเอกสารต้นทาง)
    group: B
    useCases:
      - UC-09
  FR-B04:
    id: FR-B04
    text: ระบบต้องบันทึก finding และ type/severity/description ได้ ไม่ว่าจะมาจาก Audit หรือ Non-Audit Source
    priority: Must
    group: B
    useCases:
      - UC-09
  FR-B05:
    id: FR-B05
    text: ระบบต้องผูก finding กับ document/record/evidence ได้ (audit_round_id เป็น Nullable — TBD-EFL-15 RESOLVED)
    priority: Must
    group: B
    useCases:
      - UC-09
  FR-B06:
    id: FR-B06
    text: ระบบต้องสร้าง CAR จาก finding ได้
    priority: Must
    group: B
    useCases:
      - UC-10
  FR-B07:
    id: FR-B07
    text: ระบบต้องเก็บ owner, due_date, root_cause, corrective_action, status
    priority: Must
    group: B
    useCases:
      - UC-11
  FR-B08:
    id: FR-B08
    text: ระบบต้องแนบ evidence ให้ CAR ได้
    priority: Must
    group: B
    useCases:
      - UC-11
  FR-B09:
    id: FR-B09
    text: ระบบต้องคำนวณ overdue status จาก due_date และ status
    priority: Must
    group: B
    useCases:
      - UC-11
  FR-B10:
    id: FR-B10
    text: ระบบควรรองรับ Verify/Close/Reopen CAR แบบ Two-Step Authorization โดยแยกสิทธิ์ผู้ Verify (Assistant DCC/Auditor ผู้แจ้งพบ) ออกจากผู้ Close (QMR/Lead Auditor) — สถาปัตยกรรมยืนยันแล้วจาก TBD-EFL-07 RESOLVED
    priority: Should (ตามเอกสารต้นทาง)
    group: B
    useCases:
      - UC-11
  FR-B11:
    id: FR-B11
    text: dashboard ต้องแสดง document status จาก Group A
    priority: Must
    group: B
    useCases:
      - UC-12
  FR-B12:
    id: FR-B12
    text: dashboard ต้องแสดง acknowledgement rate จาก Group A (ต้องป้องกัน Divide-by-Zero — E2)
    priority: Must
    group: B
    useCases:
      - UC-12
  FR-B13:
    id: FR-B13
    text: dashboard ต้องแสดง CAR open/overdue/closed และ recent findings
    priority: Must
    group: B
    useCases:
      - UC-12
  FR-B14:
    id: FR-B14
    text: ระบบควร export summary report เบื้องต้นได้ (เช่น Acknowledgement Logs เป็น CSV/xlsx)
    priority: Should
    group: B
    useCases:
      - UC-13
  FR-A12:
    id: FR-A12
    text: ระบบต้องให้ Group B module ดึง Document/Acknowledgement Summary ผ่าน Internal Interface ได้ (กลไกอัตโนมัติ — ดู §3.3.1)
    priority: Must
    group: A
    useCases:
      - UC-13
  FR-SH04:
    id: FR-SH04
    text: ระบบต้องบันทึก audit trail สำหรับ event สำคัญ
    priority: Must
    group: Shared
    useCases:
      - UC-14
  FR-A13:
    id: FR-A13
    text: ระบบต้องรองรับกระบวนการขอทำลายเอกสาร (Document) สถานะ Obsolete ที่ครบเกณฑ์จัดเก็บขั้นต่ำ ผ่านการอนุมัติก่อนเสมอ
    priority: Must
    group: A
    useCases:
      - UC-15
  FR-B15:
    id: FR-B15
    text: ระบบต้องรองรับกระบวนการขอทำลายบันทึกคุณภาพ (Quality Record) ที่ Retention Clock ครบกำหนดตามตารางระยะเวลาจัดเก็บ ผ่านการอนุมัติก่อนเสมอ
    priority: Must
    group: B
    useCases:
      - UC-15
  FR-SH06:
    id: FR-SH06
    text: ระบบต้องบันทึก Destruction Log (ผู้ร้องขอ, ผู้อนุมัติ, รายการ, วันที่) ทุกครั้งที่มีการทำลายข้อมูล และเก็บรักษา log นี้ไว้อย่างน้อย 5 ปี โดยห้ามลบข้อมูลอัตโนมัติ (No Auto-Deletion)
    priority: Must
    group: Shared
    useCases:
      - UC-15
  FR-A16:
    id: FR-A16
    text: ระบบต้องแสดงรายการงานค้างส่วนบุคคล (DAR รออนุมัติ/ทบทวน, เอกสารรอรับทราบ) เฉพาะของผู้ใช้ปัจจุบัน แยกจาก Operational Dashboard รวมของ Group B
    priority: Should
    group: A
    useCases:
      - UC-16
  FR-SH01:
    id: FR-SH01
    text: ระบบต้องมี Login และ JWT-based session หรือเทียบเท่า
    priority: Must
